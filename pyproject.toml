[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "csv2json"
dynamic = ["version"]
description = "Convert CSV files to JSON from the command line."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["csv", "json", "cli", "converter"]
classifiers = [
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]

[project.scripts]
csv2json = "csv2json.cli:main"

[tool.setuptools.dynamic]
version = { attr = "csv2json.__version__" }

[tool.setuptools.packages.find]
include = ["csv2json*"]
